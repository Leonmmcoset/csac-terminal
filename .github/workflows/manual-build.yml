name: Manual Build

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Artifact to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-exe
          - windows-installer
          - linux-executable
          - linux-appimage
          - macos
          - macos-dmg
          - android-apk
          - ios
          - ios-unsigned-ipa
          - web

      upload_release:
        description: Upload built artifacts to GitHub Release
        required: true
        default: false
        type: boolean

      prerelease:
        description: Mark as pre-release
        required: false
        default: false
        type: boolean

      version_changelog:
        description: Version changelog used as the GitHub Release body
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write

env:
  APP_NAME: csac
  FLUTTER_VERSION: "3.44.0"
  FLUTTER_LINUX_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.0-stable.tar.xz
  FLUTTER_WINDOWS_URL: https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.0-stable.zip

jobs:
  windows:
    name: Windows
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-exe' || github.event.inputs.artifact == 'windows-installer' }}
    runs-on: windows-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Flutter SDK
        id: cache-flutter-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter-sdk
          key: ${{ runner.os }}-flutter-sdk-${{ env.FLUTTER_VERSION }}

      - name: Install aria2
        if: ${{ steps.cache-flutter-sdk.outputs.cache-hit != 'true' }}
        run: choco install aria2 --no-progress -y

      - name: Install Inno Setup
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-installer' }}
        run: choco install innosetup --no-progress -y

      - name: Download Flutter SDK
        if: ${{ steps.cache-flutter-sdk.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP "downloads"
          $sdkDir = Join-Path $env:RUNNER_TEMP "flutter-sdk"

          New-Item -ItemType Directory -Force -Path $downloadDir, $sdkDir | Out-Null

          aria2c -s16 -x16 -k1M `
            --dir="$downloadDir" `
            --out="flutter-windows.zip" `
            "${env:FLUTTER_WINDOWS_URL}"

          Expand-Archive `
            -Path (Join-Path $downloadDir "flutter-windows.zip") `
            -DestinationPath $sdkDir `
            -Force

      - name: Configure Flutter SDK path
        shell: pwsh
        run: |
          $sdkDir = Join-Path $env:RUNNER_TEMP "flutter-sdk"
          $flutterBin = Join-Path $sdkDir "flutter\bin"
          $flutterRoot = Join-Path $sdkDir "flutter"

          if (!(Test-Path (Join-Path $flutterBin "flutter.bat"))) {
            throw "Flutter SDK was not found at $flutterRoot."
          }

          $flutterBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FLUTTER_ROOT=$flutterRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check Flutter
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter/csac/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Read app version
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          $parts = $version -split '\+'
          "APP_BUILD_NAME=$($parts[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_BUILD_NUMBER=$($parts[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows release
        run: flutter build windows --release -v --build-name $env:APP_BUILD_NAME --build-number $env:APP_BUILD_NUMBER

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: flutter/csac/build/windows/x64/runner/Release

      - name: Build Windows installer
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-installer' }}
        shell: pwsh
        run: |
          $buildDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $outputDir = (Resolve-Path ".").Path
          $outputDir = Join-Path $outputDir "build/windows/installer"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          & $iscc `
            "/DBuildDir=$buildDir" `
            "/DOutputDir=$outputDir" `
            "/DMyAppVersion=$env:APP_BUILD_NAME" `
            "..\..\.github\installer\windows\csac.iss"

      - name: Upload Windows installer
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'windows-installer' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-installer
          path: flutter/csac/build/windows/installer/*.exe

  linux:
    name: Linux
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'linux-executable' || github.event.inputs.artifact == 'linux-appimage' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux deps
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            aria2 \
            clang \
            cmake \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            ninja-build \
            pkg-config \
            liblzma-dev \
            libfuse2 \
            file \
            wget

      - name: Cache Flutter SDK
        id: cache-flutter-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter-sdk
          key: ${{ runner.os }}-flutter-sdk-${{ env.FLUTTER_VERSION }}

      - name: Download Flutter SDK
        if: ${{ steps.cache-flutter-sdk.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/flutter-sdk"

          aria2c -x16 -s16 \
            "$FLUTTER_LINUX_URL" \
            -o flutter.tar.xz

          tar -xf flutter.tar.xz \
            -C "$RUNNER_TEMP/flutter-sdk"

      - name: Configure Flutter SDK path
        run: |
          flutter_root="$RUNNER_TEMP/flutter-sdk/flutter"
          if [[ ! -x "$flutter_root/bin/flutter" ]]; then
            echo "::error::Flutter SDK was not found at $flutter_root."
            exit 1
          fi

          echo "$flutter_root/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$flutter_root" >> "$GITHUB_ENV"

      - name: Check Flutter
        run: flutter --version

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter/csac/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Read app version
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "APP_BUILD_NAME=${version%%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=${version##*+}" >> "$GITHUB_ENV"

      - name: Build Linux release
        run: flutter build linux --release -v --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER"

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux
          path: flutter/csac/build/linux/x64/release/bundle

      - name: Build Linux AppImage
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'linux-appimage' }}
        run: |
          set -euo pipefail

          BUNDLE_DIR="build/linux/x64/release/bundle"
          APPDIR="$RUNNER_TEMP/AppDir"
          ICON_SOURCE="linux/runner/resources/app_icon.png"

          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"

          # Prepare AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Copy bundle contents
          cp -a "$BUNDLE_DIR"/* "$APPDIR/usr/bin/"

          # Create symlink for AppRun
          ln -s "usr/bin/${APP_NAME}" "$APPDIR/AppRun"

          # Create desktop file
          cat > "$APPDIR/usr/share/applications/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Name=${APP_NAME}
          Exec=${APP_NAME}
          Type=Application
          Categories=Utility;
          Terminal=false
          Icon=${APP_NAME}
          EOF
          sed -i 's/^          //' "$APPDIR/usr/share/applications/${APP_NAME}.desktop"

          # Copy icon. AppImageKit expects Icon=... to resolve from AppDir root.
          if [[ -f "$APPDIR/usr/bin/data/flutter_assets/assets/icon.png" ]]; then
            ICON_SOURCE="$APPDIR/usr/bin/data/flutter_assets/assets/icon.png"
          fi
          cp "$ICON_SOURCE" "$APPDIR/${APP_NAME}.png"
          cp "$ICON_SOURCE" "$APPDIR/usr/share/icons/hicolor/256x256/apps/${APP_NAME}.png"

          # Create the AppDir directory for appimagetool
          cp "$APPDIR/usr/share/applications/${APP_NAME}.desktop" "$APPDIR/"

          # Build AppImage
          mkdir -p build/linux/appimage
          "$RUNNER_TEMP/appimagetool" "$APPDIR" \
            "build/linux/appimage/${APP_NAME}-${APP_BUILD_NAME}-x86_64.AppImage"

      - name: Upload Linux AppImage
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'linux-appimage' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-appimage
          path: flutter/csac/build/linux/appimage/*.AppImage

  macos:
    name: macOS
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'macos' || github.event.inputs.artifact == 'macos-dmg' }}
    runs-on: macos-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Prepare CocoaPods cache directories
        run: |
          mkdir -p \
            "$HOME/Library/Caches/CocoaPods" \
            "$HOME/.cocoapods/repos" \
            macos/Pods

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            flutter/csac/macos/Pods
          key: ${{ runner.os }}-macos-cocoapods-${{ hashFiles('flutter/csac/pubspec.lock', 'flutter/csac/macos/Podfile', 'flutter/csac/macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-macos-cocoapods-
            ${{ runner.os }}-cocoapods-

      - name: Check Flutter
        run: flutter --version

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Read app version
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "APP_BUILD_NAME=${version%%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=${version##*+}" >> "$GITHUB_ENV"

      - name: Build macOS release
        env:
          FLUTTER_XCODE_ARCHS: arm64 x86_64
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: NO
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: NO
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ""
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: NO
        run: flutter build macos --release -v --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER"

      - name: Package macOS app
        run: |
          mkdir -p build/macos/package

          app_path="build/macos/Build/Products/Release/${APP_NAME}.app"
          if [[ ! -d "$app_path" ]]; then
            echo "::error::macOS app bundle was not found at $app_path"
            exit 1
          fi

          lipo -info "$app_path/Contents/MacOS/${APP_NAME}"

          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "build/macos/package/${APP_NAME}-macos.zip"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos
          path: flutter/csac/build/macos/package/${{ env.APP_NAME }}-macos.zip

      - name: Build macOS DMG
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'macos-dmg' }}
        run: |
          set -euo pipefail

          app_path="build/macos/Build/Products/Release/${APP_NAME}.app"
          dmg_path="build/macos/package/${APP_NAME}-${APP_BUILD_NAME}-macos.dmg"

          mkdir -p build/macos/package

          # Create a temporary directory for DMG contents
          DMG_DIR="$RUNNER_TEMP/dmg_contents"
          mkdir -p "$DMG_DIR"

          # Copy app bundle
          cp -R "$app_path" "$DMG_DIR/"

          # Create symbolic link to /Applications
          ln -s /Applications "$DMG_DIR/Applications"

          # Create the DMG
          hdiutil create -volname "${APP_NAME}" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "$dmg_path"

          echo "DMG created at $dmg_path"

      - name: Upload macOS DMG
        if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'macos-dmg' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-dmg
          path: flutter/csac/build/macos/package/${{ env.APP_NAME }}-*-macos.dmg

  android:
    name: Android
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'android-apk' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            flutter/csac/android/**/*.gradle*
            flutter/csac/android/**/gradle-wrapper.properties
            flutter/csac/pubspec.lock

      - name: Cache Flutter SDK
        id: cache-flutter-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter-sdk
          key: ${{ runner.os }}-flutter-sdk-${{ env.FLUTTER_VERSION }}

      - name: Install aria2
        if: ${{ steps.cache-flutter-sdk.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Download Flutter SDK
        if: ${{ steps.cache-flutter-sdk.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/flutter-sdk"

          aria2c -x16 -s16 \
            "$FLUTTER_LINUX_URL" \
            -o flutter.tar.xz

          tar -xf flutter.tar.xz \
            -C "$RUNNER_TEMP/flutter-sdk"

      - name: Configure Flutter SDK path
        run: |
          flutter_root="$RUNNER_TEMP/flutter-sdk/flutter"
          if [[ ! -x "$flutter_root/bin/flutter" ]]; then
            echo "::error::Flutter SDK was not found at $flutter_root."
            exit 1
          fi

          echo "$flutter_root/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$flutter_root" >> "$GITHUB_ENV"

      - name: Check Flutter
        run: flutter --version

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter/csac/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Read app version
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "APP_BUILD_NAME=${version%%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=${version##*+}" >> "$GITHUB_ENV"

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          missing=0

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name secret is required for Android release signing."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          mkdir -p android/app/signing

          sanitize_secret() {
            printf '%s' "$1" \
              | sed '1s/^\xEF\xBB\xBF//' \
              | tr -d '\r\n\t ' \
              | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          }

          raw_keystore_base64="$ANDROID_KEYSTORE_BASE64"
          raw_keystore_base64="${raw_keystore_base64#ANDROID_KEYSTORE_BASE64=}"
          clean_keystore_base64="$(sanitize_secret "$raw_keystore_base64")"
          clean_key_alias="$(sanitize_secret "$ANDROID_KEY_ALIAS")"
          clean_key_password="$(sanitize_secret "$ANDROID_KEY_PASSWORD")"
          clean_store_password="$(sanitize_secret "$ANDROID_STORE_PASSWORD")"

          echo "ANDROID_KEYSTORE_BASE64 sanitized length: ${#clean_keystore_base64}"
          echo "ANDROID_KEY_ALIAS sanitized length: ${#clean_key_alias}"

          if ! printf '%s' "$clean_keystore_base64" | base64 --decode > android/app/signing/release.jks; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi

          if [[ ! -s android/app/signing/release.jks ]]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi

          {
            echo "storeFile=app/signing/release.jks"
            echo "storePassword=$clean_store_password"
            echo "keyAlias=$clean_key_alias"
            echo "keyPassword=$clean_key_password"
          } > android/key.properties

          keytool \
            -list \
            -keystore android/app/signing/release.jks \
            -storepass "$clean_store_password" \
            -alias "$clean_key_alias" \
            >/dev/null

      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi -v --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-android
          path: flutter/csac/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'ios' || github.event.inputs.artifact == 'ios-unsigned-ipa' }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Prepare CocoaPods cache directories
        run: |
          mkdir -p \
            "$HOME/Library/Caches/CocoaPods" \
            "$HOME/.cocoapods/repos" \
            flutter/csac/ios/Pods

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            flutter/csac/ios/Pods
          key: ${{ runner.os }}-ios-cocoapods-${{ hashFiles('flutter/csac/pubspec.lock', 'flutter/csac/ios/Podfile', 'flutter/csac/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-cocoapods-
            ${{ runner.os }}-cocoapods-

      - name: Check Flutter
        run: |
          cd flutter/csac
          flutter --version

      - name: Get dependencies
        run: |
          cd flutter/csac
          flutter pub get

      - name: Read app version
        run: |
          cd flutter/csac
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "APP_BUILD_NAME=${version%%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=${version##*+}" >> "$GITHUB_ENV"

      - name: Build iOS without code signing
        run: |
          cd flutter/csac
          flutter build ios --release -v --no-codesign --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER"

      - name: Package unsigned IPA
        run: |
          cd flutter/csac

          mkdir -p build/ios/ipa/Payload

          cp -R \
            build/ios/iphoneos/Runner.app \
            build/ios/ipa/Payload

          cd build/ios/ipa

          zip -r \
            ${APP_NAME}-ios-unsigned.ipa \
            Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ios
          path: flutter/csac/build/ios/ipa/${{ env.APP_NAME }}-ios-unsigned.ipa

  web:
    name: Web
    if: ${{ github.event.inputs.artifact == 'all' || github.event.inputs.artifact == 'web' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter/csac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Enable Web
        run: flutter config --enable-web

      - name: Get dependencies
        run: flutter pub get

      - name: Read app version
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "APP_BUILD_NAME=${version%%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=${version##*+}" >> "$GITHUB_ENV"

      - name: Build Web release
        run: flutter build web --release -v --build-name "$APP_BUILD_NAME" --build-number "$APP_BUILD_NUMBER"

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-web
          path: flutter/csac/build/web

  release:
    name: Release
    if: ${{ always() && github.event.inputs.upload_release == 'true' }}
    needs:
      - windows
      - linux
      - macos
      - android
      - ios
      - web

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(grep '^version:' flutter/csac/pubspec.yaml | awk '{print $2}')
          version=${version/+/-}

          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release files
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.tag }}"
          version="${version#v}"

          mkdir -p release-upload

          if [[ -d release-assets/${APP_NAME}-windows ]]; then
            (
              cd "release-assets/${APP_NAME}-windows"
              zip -r "../../release-upload/${APP_NAME}-${version}-windows-x64.zip" .
            )
          fi

          if compgen -G "release-assets/${APP_NAME}-windows-installer/*.exe" > /dev/null; then
            cp \
              release-assets/${APP_NAME}-windows-installer/*.exe \
              "release-upload/${APP_NAME}-${version}-windows-x64-setup.exe"
          fi

          if [[ -d release-assets/${APP_NAME}-linux ]]; then
            (
              cd "release-assets/${APP_NAME}-linux"
              tar -czf "../../release-upload/${APP_NAME}-${version}-linux-x64.tar.gz" .
            )
          fi

          if compgen -G "release-assets/${APP_NAME}-linux-appimage/*.AppImage" > /dev/null; then
            cp \
              release-assets/${APP_NAME}-linux-appimage/*.AppImage \
              "release-upload/${APP_NAME}-${version}-linux-x86_64.AppImage"
          fi

          if [[ -f release-assets/${APP_NAME}-macos/${APP_NAME}-macos.zip ]]; then
            cp \
              "release-assets/${APP_NAME}-macos/${APP_NAME}-macos.zip" \
              "release-upload/${APP_NAME}-${version}-macos-universal.zip"
          fi

          if compgen -G "release-assets/${APP_NAME}-macos-dmg/*.dmg" > /dev/null; then
            cp \
              release-assets/${APP_NAME}-macos-dmg/*.dmg \
              "release-upload/${APP_NAME}-${version}-macos-universal.dmg"
          fi

          shopt -s nullglob
          android_apks=(release-assets/${APP_NAME}-android/app-*-release.apk)
          if (( ${#android_apks[@]} > 0 )); then
            for apk in "${android_apks[@]}"; do
              apk_name="$(basename "$apk")"
              abi="${apk_name#app-}"
              abi="${abi%-release.apk}"
              cp "$apk" "release-upload/${APP_NAME}-${version}-android-${abi}.apk"
            done
          fi

          if [[ -f release-assets/${APP_NAME}-ios/${APP_NAME}-ios-unsigned.ipa ]]; then
            cp \
              "release-assets/${APP_NAME}-ios/${APP_NAME}-ios-unsigned.ipa" \
              "release-upload/${APP_NAME}-${version}-ios-unsigned.ipa"
          fi

          if [[ -d release-assets/${APP_NAME}-web ]]; then
            (
              cd "release-assets/${APP_NAME}-web"
              zip -r "../../release-upload/${APP_NAME}-${version}-web.zip" .
            )
          fi

          if ! compgen -G "release-upload/*" > /dev/null; then
            echo "::error::No release assets were prepared."
            exit 1
          fi

          sha256sum release-upload/* > release-upload/SHA256SUMS.txt

      - name: Prepare release notes
        env:
          RELEASE_CHANGELOG: ${{ github.event.inputs.version_changelog }}
        run: |
          set -euo pipefail

          if [[ -n "${RELEASE_CHANGELOG//[[:space:]]/}" ]]; then
            printf '%s\n' "$RELEASE_CHANGELOG" > release-body.md
          else
            printf 'No changelog provided.\n' > release-body.md
          fi

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: release-body.md
          files: release-upload/*
          prerelease: ${{ github.event.inputs.prerelease }}
